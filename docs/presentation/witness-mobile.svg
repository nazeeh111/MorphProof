<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1060" viewBox="0 0 375 1060" role="img" aria-labelledby="title desc"><title id="title">One omitted item changes the answer</title><desc id="desc">Actual synthetic ordered sum-of-squares transformation. A disclosed Rust loop omission reduces the failing input from two values to one. On [1.0], Python returns 1.0 and seeded Rust returns 0.0. Restoring the generated loop passes 64 positional and 3 keyword checks with a fresh seed. These are finite observations, not universal equivalence or autonomous repair.</desc><rect width="100%" height="100%" fill="#f5f3ec"/><text x="22" y="33" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#236f61">MorphProof / BEHAVIORAL EVIDENCE</text><text x="22" y="76" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#242923">One omitted item.</text><text x="22" y="113" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#242923">A different answer.</text><rect x="18" y="150" width="339" height="178" fill="#fffefa" stroke="#cbd1c6"/><text x="34" y="179" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#687068">01 / PYTHON REFERENCE</text><text x="34" y="219" font-family="Courier New, Courier, monospace" font-size="15" fill="#242923">for value in values:</text><text x="34" y="249" font-family="Courier New, Courier, monospace" font-size="15" fill="#242923">total += value * value</text><text x="34" y="293" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#687068">Ordered accumulation; source excerpt.</text><rect x="18" y="347" width="339" height="164" fill="#fffefa" stroke="#cbd1c6"/><text x="34" y="376" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#a33f20">02 / DISCLOSED SEED</text><text x="34" y="416" font-family="Courier New, Courier, monospace" font-size="15" fill="#242923">values.iter().copied()</text><text x="34" y="446" font-family="Courier New, Courier, monospace" font-size="15" fill="#a33f20">    .skip(1)</text><text x="34" y="490" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#687068">Generated Rust excerpt: omit item zero.</text><rect x="18" y="530" width="339" height="250" fill="#fffefa" stroke="#cbd1c6"/><text x="34" y="559" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#a33f20">03 / SAVED COUNTEREXAMPLE</text><text x="34" y="597" font-family="Courier New, Courier, monospace" font-size="17" fill="#242923">[1.0, -1.0]  →  [1.0]</text><text x="34" y="635" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#687068">5 bounded minimization calls</text><text x="34" y="683" font-family="Courier New, Courier, monospace" font-size="25" fill="#236f61">Python   1.0</text><text x="34" y="722" font-family="Courier New, Courier, monospace" font-size="25" fill="#a33f20">Rust     0.0</text><text x="34" y="759" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#687068">Same declared input; observed mismatch.</text><rect x="18" y="799" width="339" height="202" fill="#fffefa" stroke="#cbd1c6"/><text x="34" y="828" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#236f61">04 / RESTORE + CHALLENGE AGAIN</text><text x="34" y="868" font-family="Courier New, Courier, monospace" font-size="15" fill="#242923">values.iter().copied()</text><text x="34" y="905" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#236f61">64 positional + 3 keyword checks</text><text x="34" y="938" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#687068">Fresh seed 97; no mismatch observed.</text><text x="34" y="971" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#687068">Deterministic restoration. No model call.</text><text x="22" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#687068">Finite evidence. Universal equivalence untested.</text></svg>