<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">One omitted item changes the answer</title><desc id="desc">Actual synthetic ordered sum-of-squares transformation. A disclosed Rust loop omission reduces the failing input from two values to one. On [1.0], Python returns 1.0 and seeded Rust returns 0.0. Restoring the generated loop passes 64 positional and 3 keyword checks with a fresh seed. These are finite observations, not universal equivalence or autonomous repair.</desc><rect width="100%" height="100%" fill="#f5f3ec"/><text x="22" y="33" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#236f61">MorphProof / BEHAVIORAL EVIDENCE</text><text x="22" y="82" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#242923">One omitted item. A different answer.</text><rect x="22" y="135" width="345" height="170" fill="#fffefa" stroke="#cbd1c6"/><text x="38" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#687068">01 / PYTHON REFERENCE</text><text x="38" y="204" font-family="Courier New, Courier, monospace" font-size="15" fill="#242923">for value in values:</text><text x="38" y="234" font-family="Courier New, Courier, monospace" font-size="15" fill="#242923">total += value * value</text><text x="38" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#687068">Ordered accumulation; source excerpt.</text><rect x="387" y="135" width="345" height="170" fill="#fffefa" stroke="#cbd1c6"/><text x="403" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#a33f20">02 / DISCLOSED SEED</text><text x="403" y="204" font-family="Courier New, Courier, monospace" font-size="15" fill="#242923">values.iter().copied()</text><text x="403" y="234" font-family="Courier New, Courier, monospace" font-size="15" fill="#a33f20">    .skip(1)</text><text x="403" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#687068">Generated Rust excerpt: omit item zero.</text><rect x="752" y="135" width="426" height="320" fill="#fffefa" stroke="#cbd1c6"/><text x="768" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#a33f20">03 / SAVED COUNTEREXAMPLE</text><text x="768" y="202" font-family="Courier New, Courier, monospace" font-size="17" fill="#242923">[1.0, -1.0]  →  [1.0]</text><text x="768" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#687068">5 bounded minimization calls</text><text x="768" y="288" font-family="Courier New, Courier, monospace" font-size="25" fill="#236f61">Python   1.0</text><text x="768" y="327" font-family="Courier New, Courier, monospace" font-size="25" fill="#a33f20">Rust     0.0</text><text x="768" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#687068">Same declared input; observed mismatch.</text><rect x="22" y="355" width="710" height="190" fill="#fffefa" stroke="#cbd1c6"/><text x="38" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#236f61">04 / RESTORE + CHALLENGE AGAIN</text><text x="38" y="424" font-family="Courier New, Courier, monospace" font-size="15" fill="#242923">values.iter().copied()</text><text x="38" y="461" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#236f61">64 positional + 3 keyword checks</text><text x="38" y="494" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#687068">Fresh seed 97; no mismatch observed.</text><text x="38" y="527" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#687068">Deterministic restoration. No model call.</text><text x="22" y="592" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#687068">One synthetic sum-of-squares function. Rust 1.100.0 / PyO3 0.27.2 / Python 3.12.13.</text><text x="22" y="623" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#687068">Finite evidence, not a proof. Source pin 1.99.1 was not exercised; no adaptive-selection or autonomous-repair claim.</text></svg>