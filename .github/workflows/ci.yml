name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - run: python -m pip install -e '.[test,build]'
      - run: python -m morphproof transform examples/kernels.py --contract examples/contract.json -o runs/smoke --budget 64
      - run: maturin build --release --manifest-path runs/smoke/Cargo.toml -o runs/wheels
      - run: python -m pip install --no-index --find-links runs/wheels kernels-morphproof==0.1.0
      - run: python -I -c "import kernels; assert kernels.mean(values=[1.0, 3.0]) == 2.0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: runs/smoke/evidence/
